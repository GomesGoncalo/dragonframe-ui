[package]
name = "framespot"
version = "0.1.0"
edition = "2021"
description = "Makes the Dragon Touch frame a speaker that Spotify's apps can play on"

# Its own workspace: frameserver neither builds nor links any of this.
[workspace]

[dependencies]
env_logger = { version = "0.11", default-features = false }
futures-util = { version = "0.3", default-features = false }
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns"] }
log = "0.4"
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
